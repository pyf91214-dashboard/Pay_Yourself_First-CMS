    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Sticky Header Logic
        let lastScrollTop = 0;
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) { header.classList.add('header-hidden'); } 
            else { header.classList.remove('header-hidden'); }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });

    </script>

    <button id="backToTopBtn" onclick="scrollToTop()" class="fixed bottom-8 right-8 z-50 bg-brand-primary hover:bg-[#2d7a00] text-white w-12 h-12 rounded-full shadow-lg transition-all duration-300 transform translate-y-20 opacity-0 flex items-center justify-center focus:outline-none">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        const backToTopBtn = document.getElementById('backToTopBtn');

        // Show/Hide logic based on scroll position
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) { // Show after scrolling down 300px
                backToTopBtn.classList.remove('translate-y-20', 'opacity-0');
            } else {
                backToTopBtn.classList.add('translate-y-20', 'opacity-0');
            }
        });

        // Smooth scroll to top function
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>

                getDefaultSections() {
                    return [
                        { id: 'hero', type: 'hero', label: 'Hero Banner' },
                        { id: 'who-we-are', type: 'who_we_are', label: 'Who We Are' },
                        { id: 'origin', type: 'origin', label: 'Our Origin' },
                        { id: 'mission', type: 'mission', label: 'Our Mission' },
                        { id: 'serving', type: 'serving', label: 'Serving Everyday Americans' },
                        { id: 'system', type: 'system', label: 'The PYF System' },
                        { id: 'who-we-serve', type: 'who_we_serve', label: 'Who We Serve' },
                        { id: 'different', type: 'different', label: 'What Makes PYF Different' },
                        { id: 'pledge', type: 'pledge', label: 'Our Pledge' },
                        { id: 'journey', type: 'journey', label: 'Start Your PYF Journey' }
                    ];
                },

                normalizeSections(sections) {
                    const defaults = this.getDefaultSections();
                    if (!Array.isArray(sections)) return defaults;

                    return sections
                        .map((section, index) => {
                            const type = section?.type || section?.id;
                            const fallback = defaults.find(item => item.type === type || item.id === type);
                            if (!fallback) return null;

                            return {
                                id: section?.id || `${fallback.id}-${index + 1}`,
                                type: fallback.type,
                                label: section?.label || fallback.label
                            };
                        })
                        .filter(Boolean);
                },

                normalizeAboutUsData(content = {}) {
                    const base = this.pageData.about_us || {};
                    const heroSource = { ...(base.hero || {}), ...(content.hero || {}) };
                    const systemSource = { ...(base.system || {}), ...(content.system || {}) };
                    const journeySource = { ...(base.journey || {}), ...(content.journey || {}) };

                    const heroButtons = Array.isArray(heroSource.buttons) && heroSource.buttons.length
                        ? heroSource.buttons
                        : [
                            { text: heroSource.btn1_text || '', link: heroSource.btn1_link || '', style: 'primary' },
                            { text: heroSource.btn2_text || '', link: heroSource.btn2_link || '', style: 'secondary' }
                        ].filter(button => button.text || button.link);

                    const journeyButtons = Array.isArray(journeySource.buttons) && journeySource.buttons.length
                        ? journeySource.buttons
                        : [
                            { text: journeySource.btn1_text || '', link: journeySource.btn1_link || '', style: 'primary' },
                            { text: journeySource.btn2_text || '', link: journeySource.btn2_link || '', style: 'primary' }
                        ].filter(button => button.text || button.link);

                    const systemCards = Array.isArray(systemSource.cards)
                        ? systemSource.cards.filter(card => card && (card.title || card.desc || (Array.isArray(card.list) && card.list.length)))
                        : [];

                    return {
                        ...base,
                        ...content,
                        hero: {
                            ...(base.hero || {}),
                            ...(content.hero || {}),
                            buttons: heroButtons.map((button, index) => ({
                                text: button?.text || `Button ${index + 1}`,
                                link: button?.link || '#',
                                style: button?.style === 'secondary' ? 'secondary' : 'primary'
                            })),
                            btn1_text: heroButtons[0]?.text || '',
                            btn1_link: heroButtons[0]?.link || '',
                            btn2_text: heroButtons[1]?.text || '',
                            btn2_link: heroButtons[1]?.link || ''
                        },
                        who_we_are: {
                            ...(base.who_we_are || {}),
                            ...(content.who_we_are || {}),
                            list: Array.isArray(content.who_we_are?.list) ? content.who_we_are.list : (Array.isArray(base.who_we_are?.list) ? base.who_we_are.list : [])
                        },
                        origin: {
                            ...(base.origin || {}),
                            ...(content.origin || {}),
                            list: Array.isArray(content.origin?.list) ? content.origin.list : (Array.isArray(base.origin?.list) ? base.origin.list : [])
                        },
                        serving: {
                            ...(base.serving || {}),
                            ...(content.serving || {}),
                            stats: Array.isArray(content.serving?.stats) ? content.serving.stats : (Array.isArray(base.serving?.stats) ? base.serving.stats : []),
                            principles: Array.isArray(content.serving?.principles) ? content.serving.principles : (Array.isArray(base.serving?.principles) ? base.serving.principles : [])
                        },
                        system: {
                            ...(base.system || {}),
                            ...(content.system || {}),
                            cards: systemCards.map((card, index) => ({
                                id: card?.id || `${index + 1}`,
                                title: card?.title || `Card ${index + 1}`,
                                desc: card?.desc || '',
                                list: Array.isArray(card?.list) ? card.list : [],
                                image: card?.image || '',
                                quote: card?.quote || '',
                                footer: card?.footer || ''
                            }))
                        },
                        who_we_serve: {
                            ...(base.who_we_serve || {}),
                            ...(content.who_we_serve || {}),
                            list: Array.isArray(content.who_we_serve?.list) ? content.who_we_serve.list : (Array.isArray(base.who_we_serve?.list) ? base.who_we_serve.list : [])
                        },
                        different: {
                            ...(base.different || {}),
                            ...(content.different || {}),
                            list: Array.isArray(content.different?.list) ? content.different.list : (Array.isArray(base.different?.list) ? base.different.list : [])
                        },
                        pledge: {
                            ...(base.pledge || {}),
                            ...(content.pledge || {}),
                            list: Array.isArray(content.pledge?.list) ? content.pledge.list : (Array.isArray(base.pledge?.list) ? base.pledge.list : [])
                        },
                        journey: {
                            ...(base.journey || {}),
                            ...(content.journey || {}),
                            buttons: journeyButtons.map((button, index) => ({
                                text: button?.text || `Button ${index + 1}`,
                                link: button?.link || '#',
                                style: button?.style === 'secondary' ? 'secondary' : 'primary'
                            })),
                            btn1_text: journeyButtons[0]?.text || '',
                            btn1_link: journeyButtons[0]?.link || '',
                            btn2_text: journeyButtons[1]?.text || '',
                            btn2_link: journeyButtons[1]?.link || ''
                        },
                        sections: this.normalizeSections(content.sections ?? base.sections)
                    };
                },

                hasSection(type) {
                    return (this.pageData.about_us.sections || []).some(section => section.type === type);
                },

                getHeroButtons() {
                    return (this.pageData.about_us.hero?.buttons || []).filter(button => button && (button.text || button.link));
                },

                getHeroButtonClass(button, index) {
                    const style = button?.style || (index === 0 ? 'primary' : 'secondary');
                    const base = 'font-bold py-4 px-8 rounded shadow transition uppercase text-sm tracking-wide text-center w-full sm:w-auto';
                    return style === 'secondary'
                        ? `${base} bg-[#dcfce7] text-brand-primary hover:bg-white`
                        : `${base} bg-[#75C400] text-white hover:bg-[#389400]`;
                },

                getSystemCards() {
                    return (this.pageData.about_us.system?.cards || []).filter(card => card && (card.title || card.desc || (Array.isArray(card.list) && card.list.length)));
                },

                getSystemCardListClass(index) {
                    if (index === 0) return 'mt-6 space-y-3';
                    if (index === 1) return 'space-y-2 mb-4';
                    return 'grid grid-cols-2 gap-3 mb-6';
                },

                getSystemCardItemClass(index) {
                    if (index === 0) return 'flex items-center text-green-900 font-semibold bg-white/40 p-3 rounded-lg';
                    if (index === 1) return 'flex items-start text-green-900 text-sm';
                    return 'bg-white/50 rounded-lg p-2 text-center text-sm font-semibold text-green-900 shadow-sm';
                },

                getJourneyButtons() {
                    return (this.pageData.about_us.journey?.buttons || []).filter(button => button && (button.text || button.link));
                },

                getJourneyButtonClass(button, index) {
                    const style = button?.style || (index === 0 ? 'primary' : 'secondary');
                    const base = 'w-full md:w-auto font-bold py-4 px-8 rounded shadow hover:shadow-lg transition uppercase text-sm tracking-wide text-center';
                    return style === 'secondary'
                        ? `${base} bg-[#dcfce7] text-brand-primary hover:bg-white`
                        : `${base} bg-gradient-to-r from-[#389400] to-[#75C400] text-white hover:opacity-95`;
                },

                syncSectionLayout() {
                    const root = document.querySelector('[data-about-sections-root]');
                    if (!root) return;

                    const nodesByType = new Map(
                        Array.from(root.querySelectorAll('[data-about-section]')).map(node => [node.dataset.aboutSection, node])
                    );

                    (this.pageData.about_us.sections || []).forEach(section => {
                        const node = nodesByType.get(section.type);
                        if (node) root.appendChild(node);
                    });
                },

                getImageTargets(content) {
                    const systemCards = Array.isArray(content.system?.cards) ? content.system.cards : [];
                    return {
                        hero: content.hero?.image || 'About-us/About Us_Hero.jpg',
                        whoWeAre: content.who_we_are?.image || 'About-us/About Us_Who We Are.jpg',
                        origin: content.origin?.image || 'About-us/About Us_Our Origin.jpg',
                        mission: content.mission?.image || 'About-us/About Us_Our Mission.jpg',
                        serving: content.serving?.image || 'About-us/About Us_Serving Everyday Americans.jpg',
                        systemCards: systemCards.map((card, index) => card?.image || [
                            'About-us/About Us_Built For Real Life_Earn More.jpg',
                            'About-us/About Us_Built For Real Life_Keep More.jpg',
                            'About-us/About Us_Built For Real Life_Spend Less.jpg'
                        ][index] || 'About-us/About Us_Built For Real Life_Earn More.jpg'),
                        whoWeServe: content.who_we_serve?.image || 'About-us/About Us_Who We Serve.jpg',
                        different: content.different?.image || 'About-us/About Us_What Makes PYF Different.jpg',
                        pledge: content.pledge?.image || 'About-us/About Us_Built For Real Life_Our Commitment.jpg'
                    };
                },
                
                preloadImage(src) {
                    return new Promise((resolve, reject) => {
                        if (!src) {
                            reject(new Error('Missing image source'));
                            return;
                        }

                        const img = new Image();
                        img.onload = () => resolve(src);
                        img.onerror = () => reject(new Error(`Failed to preload image: ${src}`));
                        img.src = src;
                    });
                },
                
                async resolveImages(content) {
                    const imageTargets = this.getImageTargets(content);
                    this.resolvedImages.systemCards = new Array((imageTargets.systemCards || []).length).fill('');
                    this.loadedImages.systemCards = new Array((imageTargets.systemCards || []).length).fill(false);

                    const scalarEntries = Object.entries(imageTargets).filter(([key]) => key !== 'systemCards');
                    await Promise.all(scalarEntries.map(async ([key, src]) => {
                        try {
                            const loadedSrc = await this.preloadImage(src);
                            this.resolvedImages[key] = loadedSrc;
                            this.loadedImages[key] = true;
                        } catch (error) {
                            console.error(error);
                        }
                    }));

                    await Promise.all((imageTargets.systemCards || []).map(async (src, index) => {
                        try {
                            const loadedSrc = await this.preloadImage(src);
                            this.resolvedImages.systemCards[index] = loadedSrc;
                            this.loadedImages.systemCards[index] = true;
                        } catch (error) {
                            console.error(error);
                        }
                    }));
                },

                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const isPreviewMode = urlParams.get('mode') === 'preview';
                    let mergedAbout = { ...this.pageData.about_us };

                    try {
                        let { data, error } = await supabase.from('site_content').select('*').eq('page_id', 'about_us').single();
                        if (error) throw error;
                        if (data) {
                            const loadedContent = isPreviewMode ? data.draft_content : data.live_content;
                            mergedAbout = { ...this.pageData.about_us, ...(loadedContent || {}) };
                        }
                    } catch (e) {
                        console.error("Failed to load CMS data", e);
                    }

                    this.pageData.about_us = this.normalizeAboutUsData(mergedAbout);
                    this.syncSectionLayout();
                    this.isContentReady = true;
                    await this.resolveImages(this.pageData.about_us);
                }
            }));
        });
