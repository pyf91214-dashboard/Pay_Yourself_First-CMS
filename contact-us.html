                        bottom_text: bottomSection.bottom_text || "We're committed to making your experience with Pay Yourself First as smooth and supportive as possible. If you need help, don't hesitate to reach out.",
                        bottom_notices: Array.isArray(bottomSection.notices) ? bottomSection.notices : [],
                        sections
                    };
                },
                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const isPreviewMode = urlParams.get('mode') === 'preview';
                    
                    try {
                        let nextContent = this.normalizeContactUsData(this.pageData.contact_us);
                        let nextVersion = Date.now().toString();

                        if (typeof contactPageSupabaseClient !== 'undefined' && contactPageSupabaseClient) {
                            let { data, error } = await contactPageSupabaseClient.from('site_content').select('*').eq('page_id', 'contact_us').single();
                            if (error) throw error;
                            if (data) {
                                const loadedContent = isPreviewMode ? data.draft_content : data.live_content;
                                if (loadedContent) {
                                    nextContent = this.normalizeContactUsData({
                                        ...nextContent,
                                        ...loadedContent
                                    });
                                }
                                if (data.updated_at) {
                                    nextVersion = data.updated_at;
                                }
                            }
                        }

                        await this.preloadContactImages(nextContent, nextVersion);
                        this.contentVersion = nextVersion;
                        this.pageData.contact_us = nextContent;
                        this.$nextTick(() => this.syncContactHashTarget());
                    } catch (e) {
                        console.error("Failed to load CMS data", e);
                    } finally {
                        this.isCmsLoading = false;
                    }
                }
            }));
        });
    </script>
    <script src="js/site-nav.js"></script>
    <script src="js/site-footer.js"></script>
</body>
</html>
