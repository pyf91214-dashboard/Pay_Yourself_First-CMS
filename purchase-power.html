                    };
                },

                createFaqItem(item = {}) {
                    return {
                        q: item.q || '',
                        a: item.a || ''
                    };
                },

                createStepCard(card = {}) {
                    return {
                        icon: card.icon || 'fas fa-star',
                        title: card.title || '',
                        desc: card.desc || '',
                        accent: Boolean(card.accent)
                    };
                },

                createCategoryCard(card = {}) {
                    return {
                        icon: card.icon || 'fas fa-tag',
                        title: card.title || '',
                        desc: card.desc || ''
                    };
                },

                createPopularCard(card = {}) {
                    return {
                        image: card.image || '',
                        icon: card.icon || 'fas fa-star',
                        title: card.title || '',
                        desc: card.desc || ''
                    };
                },

                createBadge(badge = {}) {
                    if (typeof badge === 'string') {
                        return { icon: 'fas fa-check-circle', text: badge };
                    }

                    return {
                        icon: badge.icon || 'fas fa-check-circle',
                        text: badge.text || ''
                    };
                },

                normalizeSection(section = {}, fallback = {}, index = 0) {
                    return {
                        id: section.id || fallback.id || `purchase-section-${index + 1}`,
                        type: section.type || fallback.type || `section-${index + 1}`,
                        enabled: typeof section.enabled === 'boolean' ? section.enabled : (typeof fallback.enabled === 'boolean' ? fallback.enabled : true),
                        order: Number(section.order ?? fallback.order ?? index + 1),
                        content: JSON.parse(JSON.stringify(section.content || fallback.content || {}))
                    };
                },

                hydratePageData(content = {}) {
                    const defaults = this.getDefaultPageData();
                    const defaultSections = defaults.sections || [];
                    const incomingSections = Array.isArray(content.sections) ? content.sections : [];
                    const sections = incomingSections.length
                        ? incomingSections.map((section, index) => {
                            const fallback = defaultSections.find((item) => item.type === section.type) || {};
                            const normalized = this.normalizeSection(section, fallback, index);
                            const sectionContent = normalized.content || {};

                            if (normalized.type === 'steps') {
                                sectionContent.cards = Array.isArray(sectionContent.cards)
                                    ? sectionContent.cards.map((card) => this.createStepCard(card))
                                    : [];
                            } else if (normalized.type === 'savings_categories') {
                                sectionContent.cards = Array.isArray(sectionContent.cards)
                                    ? sectionContent.cards.map((card) => this.createCategoryCard(card))
                                    : [];
                            } else if (normalized.type === 'popular_savings') {
                                sectionContent.cards = Array.isArray(sectionContent.cards)
                                    ? sectionContent.cards.map((card) => this.createPopularCard(card))
                                    : [];
                            } else if (normalized.type === 'faq') {
                                sectionContent.questions = Array.isArray(sectionContent.questions)
                                    ? sectionContent.questions.map((item) => this.createFaqItem(item))
                                    : [];
                            } else if (normalized.type === 'bottom_cta') {
                                sectionContent.badges = Array.isArray(sectionContent.badges)
                                    ? sectionContent.badges.map((badge) => this.createBadge(badge))
                                    : [];
                            } else if (normalized.type === 'hero') {
                                sectionContent.buttons = Array.isArray(sectionContent.buttons)
                                    ? sectionContent.buttons.map((button) => ({ text: button.text || '', link: button.link || '' }))
                                    : [];
                            }

                            normalized.content = sectionContent;
                            return normalized;
                        })
                        : defaultSections.map((section, index) => this.normalizeSection(section, section, index));

                    return { sections };
                },

                hasSection(type) {
                    return (this.pageData.sections || []).some((section) => section.type === type && section.enabled !== false);
                },

                getSection(type) {
                    return (this.pageData.sections || []).find((section) => section.type === type) || null;
                },

                getSectionContent(type) {
                    return this.getSection(type)?.content || {};
                },

                toggleFaq(index) {
                    this.openFaqs[index] = !this.openFaqs[index];
                },

                syncSectionLayout() {
                    const root = document.querySelector('[data-purchase-sections-root]');
                    if (!root) return;

                    const nodesByType = new Map(
                        Array.from(root.querySelectorAll('[data-purchase-section]')).map((node) => [node.dataset.purchaseSection, node])
                    );

                    (this.pageData.sections || [])
                        .sort((a, b) => a.order - b.order)
                        .forEach((section) => {
                            const node = nodesByType.get(section.type);
                            if (node) root.appendChild(node);
                        });
                },

                async init() {
                    const mode = new URLSearchParams(window.location.search).get('mode');
                    this.pageData = this.hydratePageData(this.getDefaultPageData());
                    this.isContentReady = true;

                    try {
                        const { data, error } = await supabase
                            .from('site_content')
                            .select('*')
                            .eq('page_id', 'purchase-power')
                            .single();

                        if (error || !data) {
                            console.error('Purchase Power CMS load failed', error);
                            await this.$nextTick();
                            this.syncSectionLayout();
                            return;
                        }

                        const content = mode === 'preview'
                            ? data.draft_content
                            : (data.published_content ?? data.live_content);

                        if (!content) {
                            console.error('Purchase Power CMS content missing for mode', mode);
                            await this.$nextTick();
                            this.syncSectionLayout();
                            return;
                        }

                        this.pageData = JSON.parse(JSON.stringify(content));
                        this.pageData = this.hydratePageData(this.pageData);

                        console.log('Purchase page_id:', 'purchase-power');
                        console.log('Fetched:', data);
                        console.log('Final pageData:', this.pageData);

                        await this.$nextTick();
                        this.syncSectionLayout();
                        this.isContentReady = true;
                    } catch (error) {
                        console.error('Purchase Power CMS load failed', error);
                        await this.$nextTick();
                        this.syncSectionLayout();
                    }
                }
            }));
        });

        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuBtn && mobileMenu) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }

        let lastScrollTop = 0;
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', function() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (header) {
                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    header.classList.add('header-hidden');
                } else {
                    header.classList.remove('header-hidden');
                }
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });

        const backToTopBtn = document.getElementById('backToTopBtn');
        window.addEventListener('scroll', () => {
            if (!backToTopBtn) return;
            if (window.scrollY > 300) {
                backToTopBtn.classList.remove('translate-y-20', 'opacity-0');
            } else {
                backToTopBtn.classList.add('translate-y-20', 'opacity-0');
            }
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>

    <script src="js/site-nav.js"></script>
    <script src="js/site-footer.js"></script>
</body>
